name: Deploy MakeProfiles UI (Production)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: makeprofiles-ui-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production
        run: |
          npx ng build --configuration production
          node generate-sitemap.js

      - name: Package build
        run: |
          test -d dist/make-profile
          cd dist/make-profile
          zip -qr "$RUNNER_TEMP/make-profile-ui.zip" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload production build
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PROD_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/make-profile-ui.zip" \
            "$PROD_USER@$PROD_HOST:C:/Apps/make-profile-ui-staging/release.zip"

      - name: Deploy with backup
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/deploy.ps1" <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $archive = 'C:\Apps\make-profile-ui-staging\release.zip'
          $extract = 'C:\Apps\make-profile-ui-staging\release'
          $live = 'C:\nginx-1.29.8\html\make-profile'
          $backupDir = 'C:\Apps\make-profile-ui-backup'

          if (!(Test-Path $archive)) { throw "Deployment archive not found: $archive" }
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $backupFile = Join-Path $backupDir "make-profile-ui-$stamp.zip"
          Compress-Archive -Path (Join-Path $live '*') -DestinationPath $backupFile -CompressionLevel Optimal

          robocopy $extract $live /MIR /R:2 /W:2 /NFL /NDL /NP
          $copyExitCode = $LASTEXITCODE
          if ($copyExitCode -ge 8) {
            throw "Robocopy failed with exit code $copyExitCode. Previous site backup: $backupFile"
          }

          Remove-Item $extract -Recurse -Force
          Remove-Item $archive -Force
          Get-ChildItem $backupDir -Filter 'make-profile-ui-*.zip' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 5 |
            Remove-Item -Force
          Write-Output "Deployment successful. Backup: $backupFile"
          POWERSHELL

          ENCODED_COMMAND=$(iconv -f UTF-8 -t UTF-16LE "$RUNNER_TEMP/deploy.ps1" | base64 -w 0)
          ssh -i ~/.ssh/deploy_key -p "$PROD_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $ENCODED_COMMAND"
