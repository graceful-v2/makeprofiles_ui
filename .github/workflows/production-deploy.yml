
name: MakeProfiles UI Production Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production
        run: npx ng build --configuration production

      - name: Generate sitemap
        run: node generate-sitemap.js

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.PROD_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Prepare deployment folder
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.PROD_SSH_PORT }}" \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "powershell -NoProfile -Command \"New-Item -ItemType Directory -Force 'C:\Apps\make-profile-ui-staging' | Out-Null\""

      - name: Upload production files
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -P "${{ secrets.PROD_SSH_PORT }}" \
            -r dist/make-profile/. \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:C:/Apps/make-profile-ui-staging/"

      - name: Deploy with backup
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.PROD_SSH_PORT }}" \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "powershell -NoProfile -Command \"\$live='C:\nginx-1.29.8\html\make-profile'; \$stage='C:\Apps\make-profile-ui-staging'; \$backup='C:\Apps\make-profile-ui-backup'; if(Test-Path \$backup){Remove-Item \$backup -Recurse -Force}; if(Test-Path \$live){Move-Item \$live \$backup}; Move-Item \$stage \$live\""
